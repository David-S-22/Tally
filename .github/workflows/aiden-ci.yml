name: aiden-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - .github/workflows/aiden-ci.yml
              - docker-compose.yml
              - aiden/**
              - shared/**
              - janelle/database/**

  test: # Run static type checks and unit tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiden
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: aiden/**/requirements.txt
      - run: pip install -r backend/requirements.txt -r database/requirements.txt -r test/requirements.txt
      - name: Cache Mypy results
        uses: actions/cache@v6
        with:
          path: aiden/.mypy_cache
          key: ${{ runner.os }}-aidenmypy-${{ hashFiles('aiden/**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-aidenmypy-
      - name: Run mypy annotations
        run: mypy --output=json | jq -r '"::error title=Mypy issue,file=aiden/\(.file),line=\(.line),col=\(.column)::\(.message)"'
      - run: mypy
      - run: pytest

  build-health: # Check docker container health after startup
    needs: [changes, test]
    if: github.event_name != 'pull_request' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --no-deps --detach anomalies-frontend anomalies-backend anomalies-db
      - run: sleep 3
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3004/ || exit 1
      - name: Check backend availability
        run: curl --fail http://127.0.0.1:5004/ || exit 1
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6004/ || exit 1
      - run: docker logs anomalies-frontend anomalies-backend anomalies-db
        if: failure()
      - run: docker rm --force --volumes anomalies-frontend anomalies-backend anomalies-db
        if: always()
