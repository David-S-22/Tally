name: Ethan-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/Ethan-ci.yml
      - ethan/**
      - docker-compose.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/Ethan-ci.yml
      - ethan/**
      - docker-compose.yml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MULTI_AGENT_ENABLED: "false"
    defaults:
      run:
        working-directory: ethan
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt -r database/requirements.txt -r test/requirements.txt
      - run: pytest

  build-health:
    runs-on: ubuntu-latest
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build budgets-frontend budgets-backend budgets-db
      - run: docker compose up -d budgets-frontend budgets-backend budgets-db --no-deps
      - run: sleep 3
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3006/ || exit 1
      - name: Check backend availability
        run: curl --fail http://127.0.0.1:5006/ || exit 1
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6006/ || exit 1
      - run: docker compose logs budgets-frontend budgets-backend budgets-db
        if: failure()
      - run: docker compose rm --stop --force --volumes budgets-frontend budgets-backend budgets-db
        if: always()
