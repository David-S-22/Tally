name: Deploy-To-Azure

on:
  push:
    branches:
      - main
    paths:
      - "aiden/**"
      - "david/**"
      - "ethan/**"
      - "janelle/**"
      - "sophia/**"
      - "shared/**"
      - "bicep/**"
      - "deploy.sh"
      - ".github/workflows/cloud-deployment.yml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (auto, update, containers, all)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - update
          - containers
          - all

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and deploy containers to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy containers
        run: |
          chmod +x ./deploy.sh

          TARGET="${{ inputs.target || 'auto' }}"
          if [ "$TARGET" = "auto" ]; then
            if ! git rev-parse HEAD~1 &>/dev/null; then
              echo "==> No parent commit found. Running full Bicep rollout..."
              TARGET="containers"
            elif git diff --name-only HEAD~1 HEAD | grep -E "^(bicep/|deploy\.sh)"; then
              echo "==> Infrastructure or deployment script changes detected. Running full Bicep rollout..."
              TARGET="containers"
            else
              echo "==> Application code changes only. Running fast container update (skipping Bicep)..."
              TARGET="update"
            fi
          fi

          ./deploy.sh "$TARGET"
