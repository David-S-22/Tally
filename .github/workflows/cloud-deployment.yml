name: Deploy-To-Azure

on:
  push:
    branches:
      - main
    paths:
      - "aiden/**"
      - "david/**"
      - "ethan/**"
      - "janelle/**"
      - "sophia/**"
      - "shared/**"
      - "bicep/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "prompts/multi_agent/**"
      - "scripts/**"
      - "deploy.sh"
      - ".github/workflows/cloud-deployment.yml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - update
          - containers
          - all
          - ai-vms
          - ai-update

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy applications and AI VMs to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy changed services
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'auto' }}
          BEFORE_SHA: ${{ github.event.before }}
          MULTI_AGENT_TOKEN: ${{ secrets.MULTI_AGENT_TOKEN }}
          AI_VM_SSH_PUBLIC_KEY: ${{ secrets.AI_VM_SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUESTED_TARGET" != auto ]; then
            bash ./deploy.sh "$REQUESTED_TARGET"
            exit 0
          fi
          # github.event.before covers every commit in a push, including merged branches.
          if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          fi

          if grep -Eq '^(bicep/|scripts/|deploy\.sh|\.github/workflows/cloud-deployment\.yml)' <<< "$CHANGED"; then
            bash ./deploy.sh containers
            bash ./deploy.sh ai-vms
            exit 0
          fi

          if grep -Eq '^(aiden/|david/|ethan/|janelle/|sophia/|shared/|\.dockerignore)' <<< "$CHANGED"; then
            bash ./deploy.sh update
          fi
          if grep -q '^ai-services/mcp-server/' <<< "$CHANGED"; then
            bash ./deploy.sh ai-update mcp
          fi
          if grep -q '^ai-services/rag-server/' <<< "$CHANGED"; then
            bash ./deploy.sh ai-update rag
          fi
          if grep -Eq '^(ai-services/multi-agent-server/|prompts/multi_agent/)' <<< "$CHANGED"; then
            bash ./deploy.sh ai-update multi-agent
          fi
