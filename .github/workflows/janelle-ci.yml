name: Janelle-CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/janelle-ci.yml"
      - "docker-compose.yml"
      - "janelle/**"
      - "shared/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - .github/workflows/janelle-ci.yml
              - docker-compose.yml
              - janelle/**
              - shared/**

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install test dependencies
        run: pip install -r janelle/backend/requirements.txt -r janelle/database/requirements.txt -r janelle/test/requirements.txt
      - name: Run tests
        run: python -m pytest janelle/test -q

  build-health: # Check docker container health after startup
    needs: [changes, test]
    if: github.event_name != 'pull_request' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --no-deps --detach transactions-frontend transactions-backend transactions-db
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
      - run: sleep 3
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3001/health || exit 1
      - name: Check backend availability
        run: curl --fail http://127.0.0.1:5001/health || exit 1
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6001/ || exit 1
      - run: docker logs transactions-frontend transactions-backend transactions-db
        if: failure()
      - run: docker rm --force --volumes transactions-frontend transactions-backend transactions-db
        if: always()
