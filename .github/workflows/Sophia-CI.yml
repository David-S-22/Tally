name: Sophia-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"
      - "ai-services/rag-server/sources/billing/**"
      - "ai-services/mcp-server/**"
      - "docker-compose.yml"
  push:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"
      - "ai-services/rag-server/sources/billing/**"
      - "ai-services/mcp-server/**"
      - "docker-compose.yml"
  workflow_dispatch:

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r sophia/requirements.txt
      - name: Run tests
        run: python -m pytest sophia/test -q --cov=sophia/backend --cov-report=term
      - name: Check the committed bills corpus is fresh
        run: python -m sophia.rag.build_corpus --from-seed --check
      - name: Run corpus tests
        run: python -m pytest sophia/rag -q

  docker-health:
    name: Bills container health with AI-Mode, MCP and RAG disabled
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build bills-frontend bills-backend bills-db
      - run: docker compose up -d bills-db bills-backend bills-frontend --no-deps
      - name: Wait for the database and backend to answer
        run: |
          for i in $(seq 1 12); do
            curl -fs http://127.0.0.1:6005/health > /dev/null && curl -fs http://127.0.0.1:5005/health > /dev/null && break
            sleep 5
          done
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6005/health || exit 1
      - name: Check backend availability
        run: curl --fail --silent http://127.0.0.1:5005/health | grep '"ok":true' || exit 1
      - name: Check MCP and RAG modes are disabled and AI-Mode has no Ollama in CI
        run: |
          body=$(curl --fail --silent http://127.0.0.1:5005/health)
          echo "$body"
          echo "$body" | grep '"mcp":"disabled"' || exit 1
          echo "$body" | grep '"rag":"disabled"' || exit 1
          echo "$body" | grep '"ai":"unavailable"' || exit 1
          echo "$body" | grep '"ollama":"down"' || exit 1
      - name: Check disabled tool and evidence requests are refused with user-level copy
        run: |
          code=$(curl --silent --output evidence.json --write-out '%{http_code}' -X POST http://127.0.0.1:5005/api/evidence -H 'content-type: application/json' -d '{"question":"Which bill is overdue?"}')
          cat evidence.json; echo
          test "$code" = "503" || exit 1
          grep '"code":"mcp_disabled"' evidence.json || exit 1
          code=$(curl --silent --output tool.json --write-out '%{http_code}' -X POST http://127.0.0.1:5005/api/tools/retrieve_context -H 'content-type: application/json' -d '{"feature":"billing","question":"Which bill is overdue?","k":2}')
          cat tool.json; echo
          test "$code" = "503" || exit 1
          grep '"code":"mcp_disabled"' tool.json || exit 1
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3005/ || exit 1
      - run: docker logs bills-db && docker logs bills-backend && docker logs bills-frontend
        if: failure()
      - run: docker compose down -v
        if: always()
