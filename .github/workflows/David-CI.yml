name: David-CI

on:
  pull_request:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - "david/**"
              - ".github/workflows/David-CI.yml"
              - "docker-compose.yml"
              - "shared/**"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r david/database/requirements.txt
          pip install -r david/test/requirements.txt
      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest david/

  check-health:
    needs: [changes, build-and-test]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Containers
        run: docker compose build savings-frontend savings-backend savings-db
      - name: Run Savings Service
        run: docker compose up --no-deps --detach savings-frontend savings-backend savings-db
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
      - name: Check frontend availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:3002/ && exit 0
            sleep 2
          done
          exit 1
      - name: Check backend availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:5002/ && exit 0
            sleep 2
          done
          exit 1
      - name: Check database availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:6002/ && exit 0
            sleep 2
          done
          exit 1
        if: always()
      - run: docker compose down -v
