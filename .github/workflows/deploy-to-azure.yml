name: Deploy-To-Azure

on:
  push:
    branches:
      - main

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'tally-rg' }}
  AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT || 'tally' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build and deploy to Azure Container Apps
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push application images
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: docker compose build --push

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail

            az extension add \
              --name containerapp \
              --upgrade \
              --only-show-errors

            az containerapp compose create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              --compose-file-path docker-compose.yml \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --only-show-errors
