server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index anomalies.html;

    proxy_ssl_server_name on;

    location /anomalies-assets/ {
        rewrite ^/anomalies-assets/(.*)$ /$1 last;
    }

    location /anomalies-backend/ {
        proxy_pass ${ANOMALIES_BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
