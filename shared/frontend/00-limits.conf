# Release 2 (B5, cloud endpoint security): http-context directives for the public
# gateway. nginx only accepts limit_req_zone inside http {}, and the server block
# in nginx.conf is included under conf.d/, so the zone has to be declared in its
# own file. The 00- prefix keeps it ahead of default.conf when nginx reads
# conf.d/*.conf, so the zone exists before the limit_req that references it.
#
# Behind Azure Container Apps every request reaches this container from the
# environment's Envoy proxy, so $remote_addr is the same address for all callers
# and would put everyone in one bucket. Azure guarantees the rightmost value of
# X-Forwarded-For is the one it set, so that is the value to key on; the default
# branch covers running the gateway directly (docker compose, :3000).
map $http_x_forwarded_for $tally_client_ip {
    default                 $remote_addr;
    "~(?<client_ip>[0-9.]+)$" $client_ip;
}

# 30 r/s sustained with a 60-request burst: comfortably above the HTMX traffic a
# page load produces, far below what a scripted flood sends.
limit_req_zone $tally_client_ip zone=tally_gateway:10m rate=30r/s;
limit_req_status 429;
