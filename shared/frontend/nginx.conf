server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.html;

    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;

    # Release 2 (B5, cloud endpoint security). This gateway is the only container
    # app with external ingress, so it is the one endpoint the public internet can
    # reach and the right place for these controls.
    #
    # `always` is what makes the headers apply to proxied and error responses too,
    # not just the ones nginx serves from /app/public. The CSP allowlist is the two
    # CDNs the service frontends load htmx and their styles from -- adding a third
    # CDN to any frontend means adding it here. 'unsafe-inline' stays because the
    # pages carry inline htmx handlers and style attributes; dropping it is a
    # separate piece of work across all five UIs. No page is framed anywhere, so
    # frame-ancestors/X-Frame-Options can be fully closed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Zone declared in 00-limits.conf. nodelay lets a normal page load spend its
    # burst immediately rather than being drip-fed, so only a flood sees a 429.
    limit_req zone=tally_gateway burst=60 nodelay;

    # nginx reports its own version on error pages and in the Server header.
    server_tokens off;

    # Discover and proxy the individual service frontends.
    location /anomalies-frontend/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL}/;
    }

    location /anomalies-assets/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL}/;
    }

    location /transactions-frontend/ {
        proxy_pass ${TRANSACTIONS_FRONTEND_URL}/;
    }

    location /savings-frontend/ {
        proxy_pass ${SAVINGS_FRONTEND_URL}/;
    }

    location /bills-frontend/ {
        proxy_pass ${BILLS_FRONTEND_URL}/;
    }

    location /budgets-frontend/ {
        proxy_pass ${BUDGETS_FRONTEND_URL}/;
    }

    # The shared frontend never directly communicates with any of the backends, however
    # it still needs to know the backend URL paths to correctly forward requests from the UIs.
    # Note that it doesn't know what the backend URLs are, that information is owned by the
    # individual frontends. There must be an equivalent mapping in each frontend configuration!
    location /anomalies-backend/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL};
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /transactions-backend/ {
        proxy_pass ${TRANSACTIONS_FRONTEND_URL};
    }

    location /savings-backend/ {
        proxy_pass ${SAVINGS_FRONTEND_URL};
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /bills-backend/ {
        proxy_pass ${BILLS_FRONTEND_URL};
    }

    location /budgets-backend/ {
        proxy_pass ${BUDGETS_FRONTEND_URL};
    }
}
