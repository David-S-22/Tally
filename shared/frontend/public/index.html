<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tally — Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/tally-icon.svg">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/alert.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"
            integrity="sha384-fU2gwx20YcGXySGydrPaoJC4ea0NrbR57aVtU79A0lmU41xUEo5d1Z99US+p4ox2"
            crossorigin="anonymous"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand"><img class="logo" src="/tally-icon.svg" alt="" aria-hidden="true"> Tally</div>
        <nav class="navbar" id="navbar">
            <button type="button" class="nav-tab active" data-page="home"
                    hx-get="/home.html" hx-target="#content" hx-swap="innerHTML">
                Home
            </button>
            <button type="button" class="nav-tab" data-page="transactions"
                    hx-get="/transactions-frontend/" hx-target="#content" hx-swap="innerHTML">
                Transactions
            </button>
            <button type="button" class="nav-tab" data-page="anomalies"
                    hx-get="/anomalies-frontend/" hx-target="#content" hx-swap="innerHTML">
                Anomalies
            </button>
            <button type="button" class="nav-tab" data-page="savings"
                    hx-get="/savings-frontend/" hx-target="#content" hx-swap="innerHTML">
                Savings
            </button>
            <button type="button" class="nav-tab" data-page="bills"
                    hx-get="/bills-frontend/" hx-target="#content" hx-swap="innerHTML">
                Bills
            </button>
            <button type="button" class="nav-tab" data-page="budgets"
                    hx-get="/budgets-frontend/" hx-target="#content" hx-swap="innerHTML">
                Budgets
            </button>
        </nav>
    </header>

    <main class="content" id="content"
          hx-get="/home.html" hx-trigger="load" hx-swap="innerHTML">
        <p class="loading-state">Loading…</p>
    </main>

    <div id="alert"></div>

    <script>
        const navbar = document.getElementById('navbar');
        const content = document.getElementById('content');
        const tabs = Array.from(navbar.querySelectorAll('.nav-tab'));

        function activateTab(tab) {
            for (const el of tabs) {
                el.classList.remove('active');
            }
            tab.classList.add('active');
        }

        function tabFromUrl() {
            const page = window.location.hash.slice(1);
            return tabs.find(tab => tab.dataset.page === page) || tabs[0];
        }

        function loadPageFromUrl() {
            const tab = tabFromUrl();
            activateTab(tab);
            htmx.ajax('GET', tab.getAttribute('hx-get'), {
                target: '#content',
                swap: 'innerHTML'
            });
        }

        const initialTab = tabFromUrl();
        content.setAttribute('hx-get', initialTab.getAttribute('hx-get'));
        activateTab(initialTab);

        navbar.addEventListener('click', function (evt) {
            const tab = evt.target.closest('.nav-tab');
            if (!tab) return;
            activateTab(tab);
            const fragment = `#${tab.dataset.page}`;
            if (window.location.hash !== fragment) {
                window.history.pushState(null, '', fragment);
            }
        });

        window.addEventListener('popstate', loadPageFromUrl);
    </script>

    <script src="js/alert.js"></script>
</body>
</html>
