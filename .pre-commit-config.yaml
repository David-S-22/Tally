# Local pre-commit security scans (Release 2), laid out as in Lab 11: each hook
# runs one pytest file through scripts/test/pre_commit_pytest.py. Install once with
# `pre-commit install`. The agentic loop's Testing Review mode runs
# `pre-commit run --all-files` and matches hook names containing ruff,
# detect-secrets and pip-audit.
repos:
  - repo: local
    hooks:
      - id: ruff-scan
        name: Ruff Scan
        entry: python scripts/test/pre_commit_pytest.py tests/pre_commit/test_ruff_scan.py -v
        language: python
        additional_dependencies: [pytest==9.1.1, ruff==0.17.1]
        pass_filenames: false
        stages: [pre-commit]
      - id: detect-secrets-scan
        name: detect-secrets Scan
        entry: python scripts/test/pre_commit_pytest.py tests/pre_commit/test_secrets_scan.py -v
        language: python
        additional_dependencies: [pytest==9.1.1, detect-secrets==1.5.0]
        pass_filenames: false
        stages: [pre-commit]
      - id: pip-audit-scan
        name: pip-audit Scan
        entry: python scripts/test/pre_commit_pytest.py tests/pre_commit/test_dependency_audit.py -v
        language: python
        additional_dependencies: [pytest==9.1.1, pip-audit==2.10.1]
        pass_filenames: false
        stages: [pre-commit]
