server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_ssl_server_name on;

    location /api/ {
        proxy_pass ${BILLS_BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 300s;
    }

    location /ui/ {
        proxy_pass ${BILLS_BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 300s;
    }

    # The shared frontend (:3000) forwards backend calls here with the
    # /bills-backend/ prefix still attached, so each feature frontend has to
    # strip it and hand the rest to its own backend. See the note in
    # shared/frontend/nginx.conf: "There must be an equivalent mapping in each
    # frontend configuration!". The trailing slash on proxy_pass is what drops
    # the prefix -- without it /bills-backend/ui/bills falls through to the
    # try_files rule below and returns index.html with a 200.
    location /bills-backend/ {
        proxy_pass ${BILLS_BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 300s;
    }

    # The other half of the same contract, for static assets. The shared
    # frontend strips /bills-frontend/ before proxying here, so in the shell
    # this location is never reached -- it exists so that the one set of
    # /bills-frontend/... URLs in index.html also resolves when Bills is opened
    # directly on :3005. Without it those requests fall through to try_files
    # and return index.html with a 200 and the wrong content type, which a
    # browser drops silently: the page loads unstyled with nothing in the
    # console. Savings has exactly that defect at :3002 today.
    #
    # This is a local rewrite rather than a proxy -- the files are on this
    # container's own disk -- so it re-enters location / and reuses the
    # try_files rule already serving them.
    location /bills-frontend/ {
        rewrite ^/bills-frontend/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
