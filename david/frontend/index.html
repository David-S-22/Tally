<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Dashboard</title>
    <link rel="stylesheet" href="/savings-frontend/styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" 
      crossorigin="anonymous">
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/json-enc.js"></script>
  </head>
  <body>
    <div class="app-container">
      <link rel="stylesheet" href="/savings-frontend/styles/styles.css">
      <header class="dashboard-header">
        <h1>Savings Dashboard</h1>
      </header>

      <div id="error-alert" class="error-alert hidden" style="display: none;">
        <span id="error-message"></span>
        <button type="button" class="btn-close-error" onclick="hideError()">×</button>
      </div>

      <main class="dashboard-layout">
        <section class="dashboard-column">
          <div class="dashboard-panel goals-panel">
            <div class="panel-header">
              <h2>Savings Goals</h2>
            </div>
            <div id="goals" class="table-scroll-container" hx-get="/savings-backend/goals" hx-trigger="load, goalChanged from:body" hx-swap="innerHTML">
              <p class="loading-state">Loading goals...</p>
            </div>
          </div>

          <div class="dashboard-panel ai-suggestion-panel" id="ai-suggestion-container" hx-post="/savings-backend/ai-suggestion/jobs" hx-trigger="load" hx-target="#ai-suggestion-container" hx-swap="outerHTML">
            <div class="panel-header">
              <h2>AI Suggestion</h2>
              <button type="button" class="btn-refresh" 
                      hx-post="/savings-backend/ai-suggestion/jobs"
                      hx-target="#ai-suggestion-container" 
                      hx-indicator="#ai-suggestion-container" 
                      hx-swap="outerHTML">Refresh</button>
            </div>
            <div class="ai-suggestion-body" id="ai-suggestion">
              <textarea class="ai-suggestion-textbox" name="suggestion" rows="3" readonly placeholder="Waiting for AI suggestion...">Waiting for AI suggestion...</textarea>
              <div class="ai-suggestion-meta-section">
                <div class="ai-meta-item">
                  <span class="ai-meta-label">Sources:</span>
                  <span class="ai-meta-value">Waiting for AI suggestion...</span>
                </div>
                <div class="ai-meta-item">
                  <span class="ai-meta-label">Confidence:</span>
                  <span class="confidence-badge confidence-none">Waiting...</span>
                </div>
                <div class="ai-meta-item">
                  <span class="ai-meta-label">Reviewer:</span>
                  <span class="ai-meta-value">Waiting...</span>
                </div>
              </div>
              <div class="ai-suggestion-feedback-section">
                <label for="ai-feedback-input">Feedback on this suggestion:</label>
                <textarea id="ai-feedback-input" class="ai-suggestion-feedback-input" 
                          name="feedback" rows="2" 
                          placeholder="Waiting for AI suggestion..." 
                          disabled readonly></textarea>
                <div class="ai-suggestion-actions">
                  <button type="button" class="btn-accept" disabled>✓ Accept</button>
                  <button type="button" class="btn-cancel" disabled>✗ Reject</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="dashboard-column">
          <div class="dashboard-panel suggestions-panel">
            <div class="panel-header">
              <h2>Suggestions</h2>
            </div>
            <div id="suggestions" class="table-scroll-container" hx-get="/savings-backend/suggestions" hx-trigger="load, suggestionChanged from:body" hx-swap="innerHTML">
              <p class="loading-state">Loading suggestions...</p>
            </div>
          </div>

          <div class="dashboard-panel feedback-panel">
            <div class="panel-header">
              <h2>Feedback</h2>
            </div>
            <div id="feedback" class="table-scroll-container" hx-get="/savings-backend/feedback" hx-trigger="load, feedbackChanged from:body" hx-swap="innerHTML">
              <p class="loading-state">Loading feedback...</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      function showError(msg) {
        const el = document.getElementById('error-alert');
        const text = document.getElementById('error-message');
        if (el && text) {
          text.textContent = msg;
          el.classList.remove('hidden');
          el.style.removeProperty('display');
        }
      }

      function hideError() {
        const el = document.getElementById('error-alert');
        if (el) {
          el.classList.add('hidden');
          el.style.display = 'none';
        }
      }

      document.addEventListener('htmx:configRequest', function(evt) {
        const elt = evt.detail.elt;
        const row = elt.closest('tr');
        if (row) {
          const inputs = row.querySelectorAll('input');
          for (const input of inputs) {
            if (!input.checkValidity()) {
              input.focus();
              showError('Please provide all required values before submitting.');
              evt.preventDefault();
              return;
            }
          }
        }

        const suggestionContainer = elt.closest('#ai-suggestion-container');
        if (suggestionContainer && (elt.classList.contains('btn-accept') || elt.classList.contains('btn-cancel'))) {
          const suggestionBox = suggestionContainer.querySelector('.ai-suggestion-textbox');
          const suggestionText = suggestionBox ? suggestionBox.value.trim() : '';
          if (!suggestionText || suggestionText === 'Waiting for AI suggestion...' || suggestionText.startsWith('Error') || suggestionText === 'No current AI suggestion available.' || suggestionText.startsWith("You don't have") || suggestionText.startsWith("No transactions found") || suggestionText.startsWith("Insufficient context")) {
            showError('No valid suggestion available to accept or reject.');
            evt.preventDefault();
            return;
          }

          const feedbackInput = suggestionContainer.querySelector('#ai-feedback-input');
          if (feedbackInput) {
            const feedbackText = feedbackInput.value.trim();
            if (!feedbackText) {
              feedbackInput.focus();
              showError('Please provide feedback explaining why you are accepting or rejecting this suggestion.');
              evt.preventDefault();
              return;
            }
          }
        }

        hideError();
      });

      function setAiSuggestionLoading(container) {
        if (!container) return;
        const suggestionBox = container.querySelector('.ai-suggestion-textbox');
        if (suggestionBox) suggestionBox.value = 'Waiting for AI suggestion...';

        const sourcesValue = container.querySelector('.ai-meta-value');
        if (sourcesValue) sourcesValue.textContent = 'Waiting for AI suggestion...';

        const confidenceBadge = container.querySelector('.confidence-badge');
        if (confidenceBadge) {
          confidenceBadge.textContent = 'Waiting...';
          confidenceBadge.className = 'confidence-badge confidence-none';
        }

        const reviewerDetails = container.querySelector('.reviewer-details');
        if (reviewerDetails) {
          reviewerDetails.open = false;
          reviewerDetails.querySelector('summary').textContent = 'Waiting...';
          reviewerDetails.querySelector('.reviewer-feedback').hidden = true;
        }

        const feedbackInput = container.querySelector('#ai-feedback-input');
        if (feedbackInput) {
          feedbackInput.value = '';
          feedbackInput.placeholder = 'Waiting for AI suggestion...';
          feedbackInput.disabled = true;
        }

        container.querySelectorAll('button').forEach(function(b) {
          b.disabled = true;
        });
      }

      document.addEventListener('htmx:beforeRequest', function(evt) {
        const elt = evt.detail.elt;
        const target = evt.detail.target;
        const requestPath = (evt.detail.requestConfig && evt.detail.requestConfig.path) ||
                            (elt && elt.getAttribute && (elt.getAttribute('hx-get') || elt.getAttribute('hx-post'))) || '';
        const container = (elt && elt.closest ? elt.closest('#ai-suggestion-container') : null) ||
                          (target && target.closest ? target.closest('#ai-suggestion-container') : null) ||
                          document.getElementById('ai-suggestion-container');

        const isAiRefresh = Boolean(
          (container && elt && (
            elt.classList.contains('btn-accept') ||
            elt.classList.contains('btn-cancel') ||
            elt.classList.contains('btn-refresh') ||
            elt === container ||
            container.contains(elt)
          )) ||
          (target && (target.id === 'ai-suggestion-container' || (target.closest && target.closest('#ai-suggestion-container')))) ||
          (typeof requestPath === 'string' && requestPath.includes('/ai-suggestion'))
        );

        if (isAiRefresh && container && !requestPath.includes('/ai-suggestion/jobs/')) {
          setAiSuggestionLoading(container);
        }
      });

      document.addEventListener('htmx:responseError', function(evt) {
        const status = evt.detail.xhr.status;
        const resp = evt.detail.xhr.responseText;
        let msg = resp;
        try {
          const parsed = JSON.parse(resp);
          if (parsed && parsed.error) {
            msg = parsed.error;
          }
        } catch (e) {}
        showError('Request failed (' + status + '): ' + (msg || 'Invalid request or server error'));
        const refreshBtn = document.querySelector('#ai-suggestion-container .btn-refresh');
        if (refreshBtn && !refreshBtn.closest('[aria-busy="true"]')) refreshBtn.disabled = false;
      });

      document.addEventListener('htmx:sendError', function() {
        showError('Network error: Unable to communicate with the server.');
        const refreshBtn = document.querySelector('#ai-suggestion-container .btn-refresh');
        if (refreshBtn && !refreshBtn.closest('[aria-busy="true"]')) refreshBtn.disabled = false;
      });
    </script>
  </body>
</html>
