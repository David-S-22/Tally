server { 
    listen ${PORT};
    server_name _;

    root /app;
    index "index.html";

    proxy_ssl_server_name on;

    location /savings-backend/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
