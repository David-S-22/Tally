server { 
    listen ${PORT};
    server_name _;

    root /app;
    index "index.html";

    location /savings-backend/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
