server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.html;

    proxy_ssl_server_name on;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"container":"transactions-frontend"}';
    }

    location /transactions-backend/ {
        proxy_pass ${TRANSACTIONS_BACKEND_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
