<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7df6"/></marker>
  </defs>
  <rect width="1180" height="650" fill="#fff"/>
  <text x="24" y="34" font-size="19" font-weight="600" fill="#111">Bills — Release 2 architecture: one more host service, the same containers</text>

  <!-- compose group -->
  <rect x="24" y="60" width="1132" height="190" rx="10" fill="#f7f8fa" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="40" y="84" font-size="14" font-weight="600" fill="#444">Docker Compose · containerised (per student: frontend, backend/API, database)</text>

  <g>
    <rect x="60" y="110" width="230" height="86" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="175" y="146" text-anchor="middle" font-weight="600" fill="#111">bills-frontend</text>
    <text x="175" y="170" text-anchor="middle" fill="#444">nginx + HTMX · :3005</text>
  </g>
  <g>
    <rect x="475" y="110" width="230" height="86" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="590" y="146" text-anchor="middle" font-weight="600" fill="#111">bills-backend</text>
    <text x="590" y="170" text-anchor="middle" fill="#444">Flask · :5005</text>
  </g>
  <g>
    <path d="M890 118 a115 14 0 0 1 230 0 v70 a115 14 0 0 1 -230 0 z" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <path d="M890 118 a115 14 0 0 0 230 0" fill="none" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="1005" y="158" text-anchor="middle" font-weight="600" fill="#111">bills-db</text>
    <text x="1005" y="180" text-anchor="middle" fill="#444">SQLite API · :6005</text>
  </g>
  <line x1="290" y1="153" x2="475" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="382" y="144" text-anchor="middle" font-size="13" fill="#444">/bills-backend/ui/*, /api/*</text>
  <line x1="705" y1="153" x2="890" y2="153" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="797" y="144" text-anchor="middle" font-size="13" fill="#444">bills, payments, disputes, drafts</text>

  <!-- host group -->
  <rect x="24" y="330" width="1132" height="286" rx="10" fill="#f7f8fa" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="40" y="354" font-size="14" font-weight="600" fill="#444">Host processes · non-containerised · reached from the container as host.docker.internal</text>

  <g>
    <rect x="60" y="390" width="230" height="96" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="175" y="422" text-anchor="middle" font-weight="600" fill="#111">Ollama · :11434</text>
    <text x="175" y="446" text-anchor="middle" fill="#444">AI-Mode (R0)</text>
    <text x="175" y="468" text-anchor="middle" font-size="13" fill="#666">qwen2.5:3b, llama3.1:8b</text>
  </g>
  <g>
    <rect x="340" y="390" width="230" height="96" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="455" y="422" text-anchor="middle" font-weight="600" fill="#111">MCP server · :8000</text>
    <text x="455" y="446" text-anchor="middle" fill="#444">(R1) bills + transactions tools</text>
    <text x="455" y="468" text-anchor="middle" font-size="13" fill="#666">reads bills-db, transactions-db</text>
  </g>
  <g>
    <rect x="620" y="390" width="230" height="96" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
    <text x="735" y="422" text-anchor="middle" font-weight="600" fill="#111">RAG server · :5003</text>
    <text x="735" y="446" text-anchor="middle" fill="#444">(R1) retrieval only</text>
    <text x="735" y="468" text-anchor="middle" font-size="13" fill="#666">Chroma · billing collection</text>
  </g>
  <g>
    <rect x="900" y="390" width="230" height="96" rx="8" fill="#eaf2ff" stroke="#2f7df6" stroke-width="2.5"/>
    <text x="1015" y="422" text-anchor="middle" font-weight="600" fill="#111">Multi-Agent Server · :5010</text>
    <text x="1015" y="446" text-anchor="middle" fill="#444">(R2) Planner → Worker → Reviewer</text>
    <text x="1015" y="468" text-anchor="middle" font-size="13" fill="#666">SQLite history + audit · bearer token</text>
  </g>

  <!-- host-internal edges -->
  <path d="M570 438 H620" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="595" y="430" text-anchor="middle" font-size="12" fill="#444">retrieve</text>
  <path d="M1015 486 V560 H175 V486" stroke="#2f7df6" stroke-width="1.5" fill="none" marker-end="url(#arrb)"/>
  <text x="595" y="552" text-anchor="middle" font-size="13" fill="#2f7df6">three sequential model calls (planner, worker, reviewer)</text>

  <!-- backend -> host edges -->
  <path d="M520 196 V300 H175 V390" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="183" y="378" font-size="12" fill="#444">chat reply · single-model letter</text>
  <path d="M560 196 V270 H455 V390" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="463" y="378" font-size="12" fill="#444">bank charges · policy facts (MCP tools)</text>
  <path d="M650 196 V300 H1015 V390" stroke="#2f7df6" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <text x="1007" y="378" text-anchor="end" font-size="12" fill="#2f7df6">POST /workflow · /workflow/id/decision</text>

  <text x="24" y="640" font-size="12" fill="#666">Switches on bills-backend: MCP_ENABLED, RAG_ENABLED, MULTI_AGENT_ENABLED — off in CI and in the cloud baseline. A disabled route answers 503 with a safe code.</text>
</svg>
